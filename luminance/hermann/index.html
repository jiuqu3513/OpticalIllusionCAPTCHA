<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermann's Grid CAPTCHA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.back{align-self:flex-start;padding:8px 16px;color:#94a3b8;text-decoration:none;font-size:13px;margin:16px}.back:hover{color:#e2e8f0}
.container{width:100%;max-width:560px;background:#1e293b;border-radius:16px;padding:28px;margin:0 20px 40px;border:1px solid #334155}
h2{font-size:20px;text-align:center;margin-bottom:4px}.subtitle{text-align:center;font-size:12px;color:#64748b;margin-bottom:20px}
.instruction{background:#0f172a;border-radius:8px;padding:14px;margin-bottom:20px;font-size:13px;color:#94a3b8;line-height:1.6;text-align:center}
.instruction strong{color:#f87171}canvas{display:block;margin:0 auto;border-radius:10px}
.progress-row{display:flex;align-items:center;gap:10px;margin-top:16px}
.progress-bar{flex:1;height:4px;background:#334155;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:#60a5fa;width:0%;transition:width .3s}
.progress-label{font-size:12px;color:#64748b;white-space:nowrap}
.options{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.opt-btn{padding:10px 16px;border:1px solid #475569;border-radius:8px;background:#0f172a;color:#e2e8f0;cursor:pointer;font-size:13px;transition:all .15s}
.opt-btn:hover{background:#1e3a5f;border-color:#60a5fa}.opt-btn:disabled{opacity:.4;cursor:not-allowed}
.result-box{margin-top:20px;padding:18px;border-radius:10px;text-align:center;display:none}
.result-box.pass{background:#052e16;border:1px solid #166534;color:#4ade80;display:block}
.result-box.fail{background:#450a0a;border:1px solid #991b1b;color:#f87171;display:block}
.result-box h3{margin-bottom:6px;font-size:18px}.result-box p{font-size:13px;opacity:.9}
.restart-btn{margin-top:12px;padding:10px 28px;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px}.restart-btn:hover{background:#1d4ed8}
</style></head><body>
<a href="../../" class="back">← 首页</a>
<div class="container">
<h2>🔲 Hermann's Grid</h2><p class="subtitle">赫曼网格 — 交叉处出现幻影灰点，但盯着看就消失</p>
<div class="instruction" id="tip"><strong>让视线在网格上游走。</strong>交叉处出现灰色斑点了吗？</div>
<canvas id="c" width="480" height="480"></canvas>
<div class="progress-row"><div class="progress-bar"><div class="progress-fill" id="pg"></div></div><div class="progress-label" id="pl">0/4</div></div>
<div class="options" id="op"></div>
<div class="result-box" id="re"><h3 id="rt"></h3><p id="rd"></p><button class="restart-btn" onclick="rst()">重新验证</button></div>
</div>
<script src="../../js/collector.js"></script><script src="../../js/captcha-fw.js"></script>
<script>
// Hermann's Grid: 浅底深网格, 交叉处出现幻影灰点(周边视野)
const c=document.getElementById('c'),x=c.getContext('2d'),W=480,H=480;
// 参数: lineDark(线暗度), spacing(间距), lineW(线宽)
function drawGrid(spacing,lineW,lineDark){
  x.fillStyle='#f0f0f0';x.fillRect(0,0,W,H);
  x.strokeStyle=`rgb(${lineDark},${lineDark},${lineDark})`;x.lineWidth=lineW;
  for(let gx=spacing/2;gx<W;gx+=spacing){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,H);x.stroke()}
  for(let gy=spacing/2;gy<H;gy+=spacing){x.beginPath();x.moveTo(0,gy);x.lineTo(W,gy);x.stroke()}
}
let trials,tIdx,answers,tStart;
function gen(){let t=[];
// 正常: 中等对比 → 幻影灰点明显
t.push({type:'normal',spacing:50,lineW:6,lineDark:40,exp:'blobs'});
t.push({type:'normal',spacing:60,lineW:5,lineDark:60,exp:'blobs'});
t.push({type:'normal',spacing:40,lineW:7,lineDark:50,exp:'blobs'});
// catch: 极粗线 → 交叉处被填满, 无幻影点
t.push({type:'catch',ct:'thick',spacing:40,lineW:18,lineDark:80,exp:'none'});
// catch: 极浅线 → 对比度太低, 幻影点弱
t.push({type:'catch',ct:'faint',spacing:55,lineW:3,lineDark:150,exp:'none'});
return t.sort(()=>Math.random()-.5)}
trials=gen();tIdx=0;answers=[];
function run(){if(tIdx>=trials.length){showR();return}let tr=trials[tIdx];
document.getElementById('op').innerHTML='';document.getElementById('pl').textContent=`${tIdx+1}/${trials.length}`;
document.getElementById('pg').style.width=(tIdx/trials.length*100)+'%';
drawGrid(tr.spacing,tr.lineW,tr.lineDark);
document.getElementById('tip').innerHTML='<strong>让视线游走，不要盯着一处。</strong>交叉处有灰色斑点吗？';
tStart=performance.now();setTimeout(()=>showQ(),3000)}
function showQ(){tStart=performance.now();document.getElementById('tip').innerHTML='<strong>交叉处出现灰色/暗色斑点了吗？</strong>';
document.getElementById('op').innerHTML=['到处都有明显斑点','较多斑点','少量斑点','不确定','完全看不到'].map((l,i)=>`<button class="opt-btn" onclick="ans(${2-i})">${l}</button>`).join('')}
function ans(s){answers.push({trial:trials[tIdx],score:s,rt:performance.now()-tStart});tIdx++;document.getElementById('pg').style.width=(tIdx/trials.length*100)+'%';run()}
function showR(){document.getElementById('op').innerHTML='';document.getElementById('tip').innerHTML='验证完成';document.getElementById('pg').style.width='100%';document.getElementById('pl').textContent=`${trials.length}/${trials.length}`;
let total=100;let norm=answers.filter(a=>a.trial.type==='normal');let thick=answers.find(a=>a.trial.ct==='thick');let faint=answers.find(a=>a.trial.ct==='faint');
norm.forEach(a=>{if(a.score>0){}else total-=16});
if(thick&&thick.score>0)total-=25;
if(faint&&faint.score>0)total-=25;
total=Math.max(0,Math.min(100,Math.round(total)));let box=document.getElementById('re');box.className='result-box '+(total>=60?'pass':'fail');
document.getElementById('rt').textContent=total>=60?'✓ 验证通过':'✗ 验证失败';document.getElementById('rd').textContent=`得分: ${total}/100 (阈值: 60)`;box.style.display='block'}
function rst(){document.getElementById('re').style.display='none';trials=gen();tIdx=0;answers=[];document.getElementById('pg').style.width='0%';document.getElementById('pl').textContent='0/5';run()}
run();</script></body></html>
