<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotating Snakes CAPTCHA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.back{align-self:flex-start;padding:8px 16px;color:#94a3b8;text-decoration:none;font-size:13px;margin:16px}.back:hover{color:#e2e8f0}
.container{width:100%;max-width:620px;background:#1e293b;border-radius:16px;padding:28px;margin:0 20px 40px;border:1px solid #334155}
h2{font-size:20px;text-align:center;margin-bottom:4px}.subtitle{text-align:center;font-size:12px;color:#64748b;margin-bottom:20px}
.instruction{background:#0f172a;border-radius:8px;padding:14px;margin-bottom:20px;font-size:13px;color:#94a3b8;line-height:1.6;text-align:center}
.instruction strong{color:#f87171}canvas{display:block;margin:0 auto;border-radius:10px}
.progress-row{display:flex;align-items:center;gap:10px;margin-top:16px}
.progress-bar{flex:1;height:4px;background:#334155;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:#60a5fa;width:0%;transition:width .3s}
.progress-label{font-size:12px;color:#64748b;white-space:nowrap}
.options{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.opt-btn{padding:10px 16px;border:1px solid #475569;border-radius:8px;background:#0f172a;color:#e2e8f0;cursor:pointer;font-size:13px;transition:all .15s}
.opt-btn:hover{background:#1e3a5f;border-color:#60a5fa}.opt-btn:disabled{opacity:.4;cursor:not-allowed}
.result-box{margin-top:20px;padding:18px;border-radius:10px;text-align:center;display:none}
.result-box.pass{background:#052e16;border:1px solid #166534;color:#4ade80;display:block}
.result-box.fail{background:#450a0a;border:1px solid #991b1b;color:#f87171;display:block}
.result-box h3{margin-bottom:6px;font-size:18px}.result-box p{font-size:13px;opacity:.9}
.score-detail{font-size:11px;color:#94a3b8;margin-top:8px}
.restart-btn{margin-top:12px;padding:10px 28px;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px}.restart-btn:hover{background:#1d4ed8}
</style></head><body>
<a href="../../" class="back">← 首页</a>
<div class="container">
<h2>🐍 Rotating Snakes (标准)</h2><p class="subtitle">完全静态的蛇盘阵列产生周边漂移错觉 — 复刻 mot-snakesLum</p>
<div class="instruction" id="tip"><strong>不要盯着一个蛇盘看！</strong>让视线在蛇盘间游走，用余光感受旋转。</div>
<canvas id="c" width="580" height="460"></canvas>
<div class="progress-row"><div class="progress-bar"><div class="progress-fill" id="pg"></div></div><div class="progress-label" id="pl">0/4</div></div>
<div class="options" id="op"></div>
<div class="result-box" id="re"><h3 id="rt"></h3><p id="rd"></p><div class="score-detail" id="sd"></div><button class="restart-btn" onclick="rst()">重新验证</button></div>
</div>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d'),W=580,H=460;
// 4色序列: 黑→20%灰→白→10%灰
const C0='#000000',C1='#333333',C2='#ffffff',C3='#1a1a1a';

// 渲染单个蛇盘到指定context
function renderDisc(oc,cx0,cy0,radius,nRings,clockwise){
  const nQ=24;let dr=3,r0,r1=dr;
  const seq=clockwise?[C0,C1,C2,C3]:[C0,C3,C2,C1];
  for(let ring=0;ring<nRings;ring++){r0=r1;r1=r0+dr;dr+=2;
    const da=2*Math.PI/nQ,off=(ring&1)?0.5:0;
    for(let i=0;i<nQ;i++){const a0=da*(i+off),aE=da*(i+1+off),seg=(aE-a0)/4;
      for(let s=0;s<4;s++){oc.fillStyle=seq[s];oc.beginPath();
        oc.arc(cx0,cy0,r1,a0+s*seg,a0+(s+1)*seg);oc.arc(cx0,cy0,r0,a0+(s+1)*seg,a0+s*seg,true);
        oc.closePath();oc.fill();}}}}

// 渲染无错觉对照盘
function renderCtrlDisc(oc,cx0,cy0,radius,nRings){
  const nQ=24;let dr=3,r0,r1=dr;
  const cols=['#333','#888','#333','#888'];
  for(let ring=0;ring<nRings;ring++){r0=r1;r1=r0+dr;dr+=2;
    const da=2*Math.PI/nQ,off=(ring&1)?0.5:0;
    for(let i=0;i<nQ;i++){const a0=da*(i+off),aE=da*(i+1+off),seg=(aE-a0)/4;
      for(let s=0;s<4;s++){oc.fillStyle=cols[s];oc.beginPath();
        oc.arc(cx0,cy0,r1,a0+s*seg,a0+(s+1)*seg);oc.arc(cx0,cy0,r0,a0+(s+1)*seg,a0+s*seg,true);
        oc.closePath();oc.fill();}}}}

// 渲染5行蛇盘网格到offscreen canvas
function renderGrid(clockwise,ctrl){
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const oc=c.getContext('2d');oc.fillStyle='#ccc';oc.fillRect(0,0,W,H);
  const ox=224;oc.save();oc.translate(W/2-2*ox,H/2-1.4*ox);
  for(let iy=0;iy<5;iy++){const ixTop=(iy&1)?2:3;
    for(let ix=0;ix<ixTop;ix++){oc.translate(ox,0);
      oc.fillStyle='#ccc';oc.beginPath();oc.arc(0,0,ox/2,0,2*Math.PI);oc.fill();
      const cw=clockwise?((iy&1)===0):true;
      if(ctrl)renderCtrlDisc(oc,0,0,ox/2-4,8);else renderDisc(oc,0,0,ox/2-4,8,cw);
    }oc.translate(-(2+0.5)*ox,ox/1.5);}
  oc.restore();return c;
}

let SNAKE_CW=renderGrid(true,false),SNAKE_CCW=renderGrid(false,false),CTRL=renderGrid(true,true);
let trials,tIdx,answers,animId,tStart;

function gen(){let t=[];
t.push({type:'normal',img:SNAKE_CW,exp:'rot'});t.push({type:'normal',img:SNAKE_CCW,exp:'rot'});
t.push({type:'catch',ct:'ctrl',img:CTRL,exp:'static'});
t.push({type:'catch',ct:'anim',img:SNAKE_CW,anim:true,exp:'rot'});
return t.sort(()=>Math.random()-.5)}
trials=gen();tIdx=0;answers=[];

function run(){if(tIdx>=trials.length){showR();return}
let tr=trials[tIdx];document.getElementById('op').innerHTML='';
document.getElementById('pl').textContent=`${tIdx+1}/${trials.length}`;
document.getElementById('pg').style.width=(tIdx/trials.length*100)+'%';
if(tr.anim)startAnim(tr);else showStatic(tr)}
function showStatic(tr){cx.drawImage(tr.img,0,0);cx.fillStyle='#ef4444';cx.beginPath();cx.arc(W/2,H/2,5,0,2*Math.PI);cx.fill();
document.getElementById('tip').innerHTML='<strong>不要盯中心！</strong>用余光感受蛇盘是否在旋转…';tStart=performance.now();setTimeout(()=>showQ(),3000)}
function startAnim(tr){let angle=0,elapsed=0,lt=performance.now();document.getElementById('tip').innerHTML='图案在缓慢旋转…注意观察。';
function anim(now){let dt=Math.min((now-lt)/1000,.1);lt=now;elapsed+=dt;angle+=20*dt;
cx.fillStyle='#ccc';cx.fillRect(0,0,W,H);cx.save();cx.translate(W/2,H/2);cx.rotate(angle*Math.PI/180);
cx.drawImage(tr.img,-W/2,-H/2);cx.restore();
if(elapsed<3)animId=requestAnimationFrame(anim);else{cx.drawImage(tr.img,0,0);showQ()}}animId=requestAnimationFrame(anim)}
function showQ(){document.getElementById('tip').innerHTML='<strong>你在周边视野中感知到旋转吗？</strong>';tStart=performance.now();
document.getElementById('op').innerHTML=['明显在旋转','有些旋转感','不确定','基本静止','完全静止'].map((l,i)=>`<button class="opt-btn" onclick="ans(${2-i})">${l}</button>`).join('')}
function ans(s){answers.push({trial:trials[tIdx],score:s,rt:performance.now()-tStart});tIdx++;document.getElementById('pg').style.width=(tIdx/trials.length*100)+'%';run()}
function showR(){document.getElementById('op').innerHTML='';document.getElementById('tip').innerHTML='验证完成';document.getElementById('pg').style.width='100%';document.getElementById('pl').textContent=`${trials.length}/${trials.length}`;
let total=100;let norm=answers.filter(a=>a.trial.type==='normal');let ctrl=answers.find(a=>a.trial.ct==='ctrl');let anim=answers.find(a=>a.trial.ct==='anim');
norm.forEach(a=>{if(a.score>0){}else total-=18});if(ctrl&&ctrl.score>0)total-=30;if(anim&&anim.score<2)total-=22;
total=Math.max(0,Math.min(100,Math.round(total)));let box=document.getElementById('re');box.className='result-box '+(total>=60?'pass':'fail');
document.getElementById('rt').textContent=total>=60?'✓ 验证通过':'✗ 验证失败';document.getElementById('rd').textContent=`得分: ${total}/100 (阈值: 60)`;
document.getElementById('sd').textContent=`对照: ${ctrl?.score<=0?'✓':'✗'} | 动画: ${anim?.score>=2?'✓':'✗'}`;box.style.display='block'}
function rst(){document.getElementById('re').style.display='none';trials=gen();tIdx=0;answers=[];document.getElementById('pg').style.width='0%';document.getElementById('pl').textContent='0/4';run()}
run();</script></body></html>
