<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motion Induced Blindness CAPTCHA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.back{align-self:flex-start;padding:8px 16px;color:#94a3b8;text-decoration:none;font-size:13px;margin:16px}.back:hover{color:#e2e8f0}
.container{width:100%;max-width:540px;background:#1e293b;border-radius:16px;padding:28px;margin:0 20px 40px;border:1px solid #334155}
h2{font-size:20px;text-align:center;margin-bottom:4px}.subtitle{text-align:center;font-size:12px;color:#64748b;margin-bottom:20px}
.instruction{background:#0f172a;border-radius:8px;padding:14px;margin-bottom:20px;font-size:13px;color:#94a3b8;line-height:1.6;text-align:center}
.instruction strong{color:#f87171}canvas{display:block;margin:0 auto;border-radius:10px}
.progress-row{display:flex;align-items:center;gap:10px;margin-top:16px}
.progress-bar{flex:1;height:4px;background:#334155;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:#60a5fa;width:0%;transition:width .3s}
.progress-label{font-size:12px;color:#64748b;white-space:nowrap}
.options{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.opt-btn{padding:10px 16px;border:1px solid #475569;border-radius:8px;background:#0f172a;color:#e2e8f0;cursor:pointer;font-size:13px;transition:all .15s}
.opt-btn:hover{background:#1e3a5f;border-color:#60a5fa}.opt-btn:disabled{opacity:.4;cursor:not-allowed}
.result-box{margin-top:20px;padding:18px;border-radius:10px;text-align:center;display:none}
.result-box.pass{background:#052e16;border:1px solid #166534;color:#4ade80;display:block}
.result-box.fail{background:#450a0a;border:1px solid #991b1b;color:#f87171;display:block}
.result-box h3{margin-bottom:6px;font-size:18px}.result-box p{font-size:13px;opacity:.9}
.score-detail{font-size:11px;color:#94a3b8;margin-top:8px}
.restart-btn{margin-top:12px;padding:10px 28px;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px}
.restart-btn:hover{background:#1d4ed8}.hidden{display:none!important}
</style></head><body>
<a href="../../" class="back">← 首页</a>
<div class="container">
<h2>👁️ Motion Induced Blindness</h2>
<p class="subtitle">运动致盲 — 物理存在的点从意识中消失</p>
<div class="instruction" id="tip"><strong>死死盯住中心的闪烁点！不要直接看三个黄点。</strong>黄点有时会从视野中消失吗？</div>
<canvas id="c" width="460" height="460"></canvas>
<div class="progress-row"><div class="progress-bar"><div class="progress-fill" id="pg"></div></div><div class="progress-label" id="pl">0/4</div></div>
<div class="options" id="op"></div>
<div class="result-box" id="re"><h3 id="rt"></h3><p id="rd"></p><div class="score-detail" id="sd"></div><button class="restart-btn" onclick="rst()">重新验证</button></div>
</div>
<script src="../../js/collector.js"></script><script src="../../js/captcha-fw.js"></script>
<script>
// 精确复刻 mot-mib: 旋转蓝十字网格 + 竖条纹背景 + 3个静止黄点 + 闪烁注视点
const c=document.getElementById('c'),x=c.getContext('2d'),W=460,H=460,CX=W/2,CY=H/2;
let rotAngle=0,rpm=12,fc=0;
// 3个黄点位置 (复刻源码)
let dots=[{x:CX-W/6,y:CY+H/6},{x:CX+W/6,y:CY+H/6},{x:CX,y:CY-H/6*Math.sqrt(2)}];
let trials,tIdx,answers,animId,tStart;

function drawBg(){// 竖条纹背景
  for(let i=0;i<W;i+=8){x.fillStyle=(Math.floor(i/8)%2===0)?'#000':'#4d4d4d';x.fillRect(i,0,8,H)}
}
function drawCrosses(rot){// 旋转蓝色十字网格
  x.save();x.translate(CX,CY);x.rotate(rot*Math.PI/180);x.strokeStyle='#4d4dff';x.lineWidth=5;x.beginPath();
  let cs=W/(3*6),gs=cs*2;
  for(let ix=-3;ix<=3;ix++)for(let iy=-3;iy<=3;iy++){
    let px=ix*gs,py=iy*gs;
    x.moveTo(px-cs,py);x.lineTo(px+cs,py);x.moveTo(px,py-cs);x.lineTo(px,py+cs);
  }
  x.stroke();x.restore()
}
function drawDots(visible){if(!visible)return;x.fillStyle='#ff0';dots.forEach(d=>{x.beginPath();x.arc(d.x,d.y,5,0,Math.PI*2);x.fill()})}
function drawFix(){fc++;x.fillStyle=(Math.floor(fc/120)%2===0)?'#0f0':'#f00';x.beginPath();x.arc(CX,CY,3,0,Math.PI*2);x.fill()}

function gen(){let t=[];t.push({type:'normal',rot:true,striped:true,dotsVisible:true,exp:'vanish'});t.push({type:'normal',rot:true,striped:true,dotsVisible:true,exp:'vanish'});t.push({type:'catch',ct:'noRot',rot:false,striped:true,dotsVisible:true,exp:'visible'});t.push({type:'catch',ct:'noDots',rot:true,striped:true,dotsVisible:false,exp:'none'});return t.sort(()=>Math.random()-.5)}
CAPTCHA.reset();trials=gen();tIdx=0;answers=[];

function run(){if(tIdx>=trials.length){showR();return}let tr=trials[tIdx];document.getElementById('op').innerHTML='';document.getElementById('pl').textContent=`${tIdx+1}/${trials.length}`;document.getElementById('pg').style.width=(tIdx/trials.length*100)+'%';rotAngle=0;if(!tr.dotsVisible)dots=[];else dots=[{x:CX-W/6,y:CY+H/6},{x:CX+W/6,y:CY+H/6},{x:CX,y:CY-H/6*Math.sqrt(2)}];drawAll(tr,0);setTimeout(()=>startAnim(tr),500)}
function drawAll(tr,rot){x.fillStyle='#808080';x.fillRect(0,0,W,H);if(tr.striped)drawBg();drawCrosses(tr.rot?rot:0);drawDots(tr.dotsVisible);drawFix()}
function startAnim(tr){let elapsed=0,lt=performance.now(),angle=0;function anim(now){let dt=Math.min((now-lt)/1000,.1);lt=now;elapsed+=dt;if(tr.rot)angle=(rpm*360/60*elapsed)%360;drawAll(tr,angle);if(elapsed<3.5)animId=requestAnimationFrame(anim);else showQ(tr)}animId=requestAnimationFrame(anim)}
function showQ(tr){tStart=performance.now();document.getElementById('tip').innerHTML=tr.dotsVisible?'<strong>三个黄点是否有时会消失？</strong>':'<strong>画面中是否有黄点？</strong>';document.getElementById('op').innerHTML=(tr.dotsVisible?['经常消失','偶尔消失','不确定','基本都在','始终清晰可见']:['有黄点','好像有','不确定','好像没有','没有黄点']).map((l,i)=>`<button class="opt-btn" onclick="ans(${2-i})">${l}</button>`).join('')}
function ans(s){answers.push({trial:trials[tIdx],score:s,rt:performance.now()-tStart});tIdx++;document.getElementById('pg').style.width=(tIdx/trials.length*100)+'%';run()}
function showR(){document.getElementById('op').innerHTML='';document.getElementById('tip').innerHTML='验证完成';document.getElementById('pg').style.width='100%';document.getElementById('pl').textContent=`${trials.length}/${trials.length}`;let total=100;let norm=answers.filter(a=>a.trial.type==='normal');let noRot=answers.find(a=>a.trial.ct==='noRot');let noDots=answers.find(a=>a.trial.ct==='noDots');norm.forEach(a=>{if(a.score<=0){}else total-=18});if(noRot&&noRot.score<=0)total-=30;if(noDots&&noDots.score>0)total-=30;total=Math.max(0,Math.min(100,Math.round(total)));let box=document.getElementById('re');box.className='result-box '+(total>=60?'pass':'fail');document.getElementById('rt').textContent=total>=60?'✓ 验证通过':'✗ 验证失败';document.getElementById('rd').textContent=`得分: ${total}/100 (阈值: 60)`;document.getElementById('sd').textContent=`致盲感知: ${norm.filter(a=>a.score<=0).length}/${norm.length} | 无旋转: ${noRot?.score>0?'✓':'✗'} | 无点: ${noDots?.score<=0?'✓':'✗'}`;box.style.display='block';CAPTCHA.init('motion-blindness',total,total>=60,trials,function(i){tIdx=i;document.getElementById('pg').style.width=(i/trials.length*100)+'%';answers=answers.slice(0,i);run()})}
function rst(){document.getElementById('re').style.display='none';CAPTCHA.reset();trials=gen();tIdx=0;answers=[];document.getElementById('pg').style.width='0%';document.getElementById('pl').textContent='0/4';run()}
run();</script></body></html>
