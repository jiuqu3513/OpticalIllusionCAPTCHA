<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roget's Palisade CAPTCHA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.back{align-self:flex-start;padding:8px 16px;color:#94a3b8;text-decoration:none;font-size:13px;margin:16px}.back:hover{color:#e2e8f0}
.container{width:100%;max-width:540px;background:#1e293b;border-radius:16px;padding:28px;margin:0 20px 40px;border:1px solid #334155}
h2{font-size:20px;text-align:center;margin-bottom:4px}.subtitle{text-align:center;font-size:12px;color:#64748b;margin-bottom:20px}
.instruction{background:#0f172a;border-radius:8px;padding:14px;margin-bottom:20px;font-size:13px;color:#94a3b8;line-height:1.6;text-align:center}
.instruction strong{color:#f87171}canvas{display:block;margin:0 auto;border-radius:10px}
.progress-row{display:flex;align-items:center;gap:10px;margin-top:16px}
.progress-bar{flex:1;height:4px;background:#334155;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:#60a5fa;width:0%;transition:width .3s}
.progress-label{font-size:12px;color:#64748b;white-space:nowrap}
.options{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.opt-btn{padding:10px 16px;border:1px solid #475569;border-radius:8px;background:#0f172a;color:#e2e8f0;cursor:pointer;font-size:13px;transition:all .15s}
.opt-btn:hover{background:#1e3a5f;border-color:#60a5fa}.opt-btn:disabled{opacity:.4;cursor:not-allowed}
.result-box{margin-top:20px;padding:18px;border-radius:10px;text-align:center;display:none}
.result-box.pass{background:#052e16;border:1px solid #166534;color:#4ade80;display:block}
.result-box.fail{background:#450a0a;border:1px solid #991b1b;color:#f87171;display:block}
.result-box h3{margin-bottom:6px;font-size:18px}.result-box p{font-size:13px;opacity:.9}
.score-detail{font-size:11px;color:#94a3b8;margin-top:8px}
.restart-btn{margin-top:12px;padding:10px 28px;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px}.restart-btn:hover{background:#1d4ed8}
</style></head><body>
<a href="../../" class="back">← 首页</a>
<div class="container">
<h2>🪜 Roget's Palisade 错觉</h2><p class="subtitle">栅栏错觉 — 透过移动竖条纹看旋转辐条，频闪运动错觉</p>
<div class="instruction" id="tip"><strong>透过红色栅栏观察辐条。</strong>辐条看起来在往哪个方向转？速度如何？</div>
<canvas id="c" width="480" height="480"></canvas>
<div class="progress-row"><div class="progress-bar"><div class="progress-fill" id="pg"></div></div><div class="progress-label" id="pl">0/4</div></div>
<div class="options" id="op"></div>
<div class="result-box" id="re"><h3 id="rt"></h3><p id="rd"></p><div class="score-detail" id="sd"></div><button class="restart-btn" onclick="rst()">重新验证</button></div>
</div>
<script>
// 精确复刻 mot-Roget OTView.j
// nSpokes=16, lineWidth=5, r=0.8*ym, speed=75/50=1.5rad/s
// fence: period=spokeAngle*r, bar=period-5, gap=5px, reddish rgba(128,51,51,alpha)
// phase100=78, isMoving=YES, background=0.75 gray

const c=document.getElementById('c'),x=c.getContext('2d'),W=480,H=480,CX=W/2,CY=H/2;
const N_SPOKES=16,R=0.8*CY,SPEED=75/50; // 1.5 rad/s
let angle=0;

function drawWheel(colored){
  x.save();x.translate(CX,CY);
  // 辐条
  x.lineWidth=5;x.lineCap='round';
  for(let i=0;i<N_SPOKES;i++){
    let t=2*Math.PI*i/N_SPOKES-angle;
    if(colored){let h=(2*i/N_SPOKES)%1;x.strokeStyle=`hsl(${h*360},100%,50%)`}
    else x.strokeStyle='#000';
    x.beginPath();x.moveTo(0,0);x.lineTo(R*Math.cos(t),R*Math.sin(t));x.stroke();
  }
  // 外圈
  x.strokeStyle='#000';x.lineWidth=5;x.beginPath();x.arc(0,0,R,0,2*Math.PI);x.stroke();
  // 轴心
  x.fillStyle='#000';x.beginPath();x.arc(0,0,10,0,2*Math.PI);x.fill();
  x.restore();
}

function drawFence(fenceAlpha,fenceShift,showFence){
  if(!showFence)return;
  let spokeAngle=2*Math.PI/N_SPOKES;
  let period=spokeAngle*R; // ~72px for R=184
  x.fillStyle=`rgba(128,51,51,${fenceAlpha})`;
  let x0=-period-(0.78*period)+fenceShift;
  while(x0<W){x.fillRect(x0,0,period-5,H);x0+=period}
}

let trials,tIdx,answers,animId,tStart,fenceAlpha=0,fenceAlphaState=1;
function gen(){let t=[];
t.push({type:'normal',colored:false,fence:true,movingFence:true,speed:75,exp:'aliased'});
t.push({type:'normal',colored:true,fence:true,movingFence:true,speed:75,exp:'aliased'});
t.push({type:'catch',ct:'noFence',colored:false,fence:false,speed:75,exp:'clear'});
t.push({type:'catch',ct:'stopped',colored:false,fence:true,movingFence:false,speed:0,exp:'static'});
t.push({type:'normal',colored:false,fence:true,movingFence:true,speed:-50,exp:'aliased'});
return t.sort(()=>Math.random()-.5)}
trials=gen();tIdx=0;answers=[];

function run(){if(tIdx>=trials.length){showR();return}
let tr=trials[tIdx];document.getElementById('op').innerHTML='';
document.getElementById('pl').textContent=`${tIdx+1}/${trials.length}`;
document.getElementById('pg').style.width=(tIdx/trials.length*100)+'%';
angle=0;fenceAlpha=tr.fence?0:1;fenceAlphaState=tr.fence?1:0;
document.getElementById('tip').innerHTML=tr.fence?'透过红色栅栏。<strong>辐条看起来在转吗？方向？</strong>':'无栅栏。<strong>辐条在转吗？方向？</strong>';
drawFrame(tr,0,0);setTimeout(()=>startAnim(tr),600)}

function drawFrame(tr,fenceShift){
  x.fillStyle='#bfbfbf';x.fillRect(0,0,W,H);
  drawWheel(tr.colored);
  drawFence(fenceAlpha,fenceShift,tr.fence);
}

function startAnim(tr){let elapsed=0,lt=performance.now();
function anim(now){let dt=Math.min((now-lt)/1000,.1);lt=now;elapsed+=dt;
  // fade in fence
  if(fenceAlphaState!==0){fenceAlpha+=fenceAlphaState*dt*2.5;if(fenceAlpha>=1){fenceAlpha=1;fenceAlphaState=0}if(fenceAlpha<=0){fenceAlpha=0;fenceAlphaState=0}}
  let spd=tr.speed/50;angle+=spd*dt;
  let fenceShift=tr.movingFence?(angle*R)%((2*Math.PI/N_SPOKES)*R):0;
  drawFrame(tr,fenceShift);
  if(elapsed<4)animId=requestAnimationFrame(anim);else showQ(tr)}
animId=requestAnimationFrame(anim)}

function showQ(tr){tStart=performance.now();
document.getElementById('tip').innerHTML='<strong>辐条看起来在往哪个方向旋转？速度感如何？</strong>';
document.getElementById('op').innerHTML=(tr.speed!==0?['逆时针很快','逆时针','逆时针慢','不动/看不清','顺时针慢','顺时针','顺时针很快']:['明显在转','有点转','不确定','基本静止','完全静止']).map((l,i)=>`<button class="opt-btn" onclick="ans(${tr.speed!==0?i-3:2-i})">${l}</button>`).join('')}

function ans(s){answers.push({trial:trials[tIdx],score:s,rt:performance.now()-tStart});tIdx++;document.getElementById('pg').style.width=(tIdx/trials.length*100)+'%';run()}

function showR(){document.getElementById('op').innerHTML='';document.getElementById('tip').innerHTML='验证完成';document.getElementById('pg').style.width='100%';document.getElementById('pl').textContent=`${trials.length}/${trials.length}`;
let total=100;let norm=answers.filter(a=>a.trial.type==='normal');let noF=answers.find(a=>a.trial.ct==='noFence');let stopped=answers.find(a=>a.trial.ct==='stopped');
// 有栅栏时方向感知被调制，应与实际方向一致（至少不是完全反向）
norm.forEach(a=>{let tr=a.trial;let expSign=tr.speed>0?1:-1;if(a.score*expSign>0){}else if(a.score===0)total-=8;else total-=16});
if(noF&&Math.abs(noF.score)<1)total-=20; // 无栅栏应清晰看到方向
if(stopped&&stopped.score!==0)total-=30;
total=Math.max(0,Math.min(100,Math.round(total)));let box=document.getElementById('re');box.className='result-box '+(total>=60?'pass':'fail');
document.getElementById('rt').textContent=total>=60?'✓ 验证通过':'✗ 验证失败';document.getElementById('rd').textContent=`得分: ${total}/100 (阈值: 60)`;
document.getElementById('sd').textContent=`无栅栏: ${noF&&Math.abs(noF.score)>=1?'✓清晰':'✗'} | 停止: ${stopped?.score===0?'✓':'✗'}`;box.style.display='block'}
function rst(){document.getElementById('re').style.display='none';trials=gen();tIdx=0;answers=[];document.getElementById('pg').style.width='0%';document.getElementById('pl').textContent='0/5';run()}
run();</script></body></html>
