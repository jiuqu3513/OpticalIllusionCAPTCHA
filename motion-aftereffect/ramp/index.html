<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>渐变后效 CAPTCHA</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
  .back { align-self: flex-start; padding: 8px 16px; color: #94a3b8; text-decoration: none; font-size: 13px; margin: 16px; }
  .back:hover { color: #e2e8f0; }
  .container { width: 100%; max-width: 520px; background: #1e293b; border-radius: 16px; padding: 28px; margin: 0 20px 40px; border: 1px solid #334155; }
  h2 { font-size: 20px; text-align: center; margin-bottom: 4px; }
  .subtitle { text-align: center; font-size: 12px; color: #64748b; margin-bottom: 20px; }
  .instruction { background: #0f172a; border-radius: 8px; padding: 14px; margin-bottom: 20px; font-size: 13px; color: #94a3b8; line-height: 1.6; text-align: center; }
  .instruction strong { color: #f87171; }
  canvas { display: block; margin: 0 auto; border-radius: 10px; }
  .progress-row { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
  .progress-bar { flex: 1; height: 4px; background: #334155; border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: #60a5fa; width: 0%; transition: width 0.3s; }
  .progress-label { font-size: 12px; color: #64748b; white-space: nowrap; }
  .options { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .opt-btn { padding: 10px 16px; border: 1px solid #475569; border-radius: 8px; background: #0f172a; color: #e2e8f0; cursor: pointer; font-size: 13px; transition: all 0.15s; }
  .opt-btn:hover { background: #1e3a5f; border-color: #60a5fa; }
  .opt-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .result-box { margin-top: 20px; padding: 18px; border-radius: 10px; text-align: center; display: none; }
  .result-box.pass { background: #052e16; border: 1px solid #166534; color: #4ade80; display: block; }
  .result-box.fail { background: #450a0a; border: 1px solid #991b1b; color: #f87171; display: block; }
  .result-box h3 { margin-bottom: 6px; font-size: 18px; }
  .result-box p { font-size: 13px; opacity: 0.9; }
  .score-detail { font-size: 11px; color: #94a3b8; margin-top: 8px; }
  .restart-btn { margin-top: 12px; padding: 10px 28px; background: #2563eb; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .restart-btn:hover { background: #1d4ed8; }
  .hidden { display: none !important; }
  .label-top, .label-bottom { position: absolute; font-size: 11px; color: #64748b; pointer-events: none; }
</style>
</head>
<body>

<a href="../../" class="back">← 首页</a>

<div class="container">
  <h2>📶 渐变后效验证</h2>
  <p class="subtitle">Ramp Aftereffect — 亮度变化方向选择性适应</p>

  <div class="instruction" id="tip">
    即将开始。请<strong>注视中心十字</strong>，观察上下两个方块的亮度变化。
  </div>

  <canvas id="canvas" width="460" height="380"></canvas>

  <div class="progress-row">
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    <div class="progress-label" id="progress-label">0/4</div>
  </div>

  <div class="options" id="options"></div>

  <div class="result-box" id="result">
    <h3 id="result-title"></h3>
    <p id="result-desc"></p>
    <div class="score-detail" id="score-detail"></div>
    <button class="restart-btn" onclick="restart()">重新验证</button>
  </div>
</div>

<script src="../../js/collector.js"></script><script src="../../js/captcha-fw.js"></script>
<script>
// ============ CONFIG ============
const CFG = {
  adaptationSec: 7.5,
  blankMs: 200,
  rampSpeed: 70, // 渐变周期速度
};

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height, CX = W/2, CY = H/2;

let trials, trialIdx, answers, animId, trialStartTime, phase;

// ============ FIXATION ============
function drawFixation() {
  const sz = 12;
  ctx.strokeStyle = '#ef4444';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(CX-sz, CY); ctx.lineTo(CX+sz, CY);
  ctx.moveTo(CX, CY-sz); ctx.lineTo(CX, CY+sz);
  ctx.stroke();
}

// ============ DRAW SCENE ============
function drawScene(phaseVal, isTest) {
  // 背景
  ctx.fillStyle = '#b3b3b3';
  ctx.fillRect(0, 0, W, H);

  // 两个方块的参数
  const bw = 200, bh = 90;
  const gap = 16;
  const topY = CY - gap/2 - bh;
  const botY = CY + gap/2;

  if (isTest) {
    // 测试阶段：两方块都是均匀灰色
    ctx.fillStyle = '#808080';
    ctx.fillRect(CX - bw/2, topY, bw, bh);
    ctx.fillRect(CX - bw/2, botY, bw, bh);
    // 边框
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 2;
    ctx.strokeRect(CX - bw/2, topY, bw, bh);
    ctx.strokeRect(CX - bw/2, botY, bw, bh);
    // 文字标注
    ctx.fillStyle = '#333';
    ctx.font = '12px system-ui';
    ctx.textAlign = 'center';
  } else {
    // 适应阶段
    // phaseVal 从 0 到 1 循环：0=黑, 0.5=灰, 1=白
    const topPhase = (phaseVal % 1 + 1) % 1; // 0→1 sawtooth（持续变亮）
    const botPhase = 1 - topPhase;             // 1→0（持续变暗）

    const topLum = Math.round(topPhase * 255);
    const botLum = Math.round(botPhase * 255);

    ctx.fillStyle = `rgb(${topLum},${topLum},${topLum})`;
    ctx.fillRect(CX - bw/2, topY, bw, bh);

    ctx.fillStyle = `rgb(${botLum},${botLum},${botLum})`;
    ctx.fillRect(CX - bw/2, botY, bw, bh);

    // 边框
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 2;
    ctx.strokeRect(CX - bw/2, topY, bw, bh);
    ctx.strokeRect(CX - bw/2, botY, bw, bh);
  }

  // 标签
  ctx.fillStyle = '#444';
  ctx.font = '11px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('上方', CX, topY - 8);
  ctx.fillText('下方', CX, botY + bh + 16);

  drawFixation();
}

// ============ TRIALS ============
function generateTrials() {
  const t = [];
  for (let i = 0; i < 3; i++) {
    t.push({
      type: 'normal',
      duration: CFG.adaptationSec + (Math.random()-0.5)*1.2,
      // 上方: 变亮 (brightening), 下方: 变暗 (dimming)
      // 后效: 上方看起来变暗, 下方看起来变亮
      // 问题只问上方 → 预期: 变暗 (negative)
    });
  }
  // 捕捉: 零适应
  t.push({ type: 'catch', catchType: 'zero', duration: 0 });
  return t.sort(() => Math.random()-0.5);
}

// ============ FLOW ============
trials = generateTrials();
trialIdx = 0;
answers = [];
console.log('Ramp trials:', trials.map(t => ({type:t.type, dur:t.duration?.toFixed(1)})));

function runTrial() {
  if (trialIdx >= trials.length) { showResult(); return; }
  const trial = trials[trialIdx];
  document.getElementById('options').innerHTML = '';
  document.getElementById('progress-label').textContent = `${trialIdx+1}/${trials.length}`;
  document.getElementById('progress').style.width = (trialIdx/trials.length*100)+'%';

  if (trial.duration === 0) {
    document.getElementById('tip').innerHTML = '准备观察静止方块...';
    drawScene(0, true);
    setTimeout(() => showTest(trial), 500);
  } else {
    document.getElementById('tip').innerHTML = '准备注视中心<strong>红色十字</strong>...';
    phase = 0;
    drawScene(0, false);
    setTimeout(() => startAdapt(trial), 600);
  }
}

function startAdapt(trial) {
  let elapsed = 0, lastTime = performance.now();
  phase = Math.random(); // 随机初始相位

  document.getElementById('tip').innerHTML = '🔴 <strong>注视中心十字</strong>，上方持续变亮，下方持续变暗...';

  function anim(now) {
    const dt = Math.min((now-lastTime)/1000, 0.1);
    lastTime = now;
    elapsed += dt;
    phase += CFG.rampSpeed/60 * dt;
    drawScene(phase, false);

    if (elapsed < trial.duration) {
      animId = requestAnimationFrame(anim);
    } else {
      // 空白过渡
      ctx.fillStyle = '#b3b3b3';
      ctx.fillRect(0,0,W,H);
      drawFixation();
      setTimeout(() => showTest(trial), CFG.blankMs);
    }
  }
  animId = requestAnimationFrame(anim);
}

function showTest(trial) {
  drawScene(0, true);
  document.getElementById('tip').innerHTML = '方块已静止。<strong>上方灰色方块看起来在变亮还是变暗？</strong>';
  trialStartTime = performance.now();

  // 7级量表：变暗(强中弱)/不变/变亮(弱中强)
  const labels = ['明显变暗','略微变暗','非常轻微变暗','完全不变','非常轻微变亮','略微变亮','明显变亮'];
  const values = [-3,-2,-1,0,1,2,3];

  document.getElementById('options').innerHTML = values.map((v,i) =>
    `<button class="opt-btn" onclick="answer(${v})">${labels[i]}</button>`
  ).join('');
}

function answer(score) {
  const rt = performance.now() - trialStartTime;
  answers.push({ trial: trials[trialIdx], score, rt });
  trialIdx++;
  document.getElementById('progress').style.width = (trialIdx/trials.length*100)+'%';
  runTrial();
}

function showResult() {
  document.getElementById('options').innerHTML = '';
  document.getElementById('tip').innerHTML = '验证完成';
  document.getElementById('progress').style.width = '100%';
  document.getElementById('progress-label').textContent = `${trials.length}/${trials.length}`;

  let total = 100;
  const normal = answers.filter(a => a.trial.type === 'normal');
  const catchTrial = answers.find(a => a.trial.type === 'catch');
  let dirOk = 0;

  // 适应：上方变亮 → 后效：上方看起来变暗（负分）
  normal.forEach(a => {
    if (a.score < 0) dirOk++;
    if (a.score > 0) total -= 15;
    if (a.score === 0) total -= 8;
  });

  if (catchTrial) {
    const abs = Math.abs(catchTrial.score);
    if (abs >= 2) total -= 35;
    else if (abs >= 1) total -= 22;
  }

  const rts = answers.map(a => a.rt);
  const rtVar = Math.max(...rts) - Math.min(...rts);
  if (rtVar < 80) total -= 15;

  total = Math.max(0, Math.min(100, Math.round(total)));
  const passed = total >= 60;

  const box = document.getElementById('result');
  box.className = 'result-box ' + (passed ? 'pass' : 'fail');
  document.getElementById('result-title').textContent = passed ? '✓ 验证通过' : '✗ 验证失败';
  document.getElementById('result-desc').textContent = `得分: ${total}/100 (阈值: 60)`;
  document.getElementById('score-detail').textContent =
    `方向正确: ${dirOk}/${normal.length} (上方应显变暗) | 反应时波动: ${Math.round(rtVar)}ms`;

  console.log('Ramp answers:', answers.map(a => ({score:a.score, rt:Math.round(a.rt)})));
}

function restart() {
  document.getElementById('result').className = 'result-box';
  document.getElementById('result').style.display = 'none';
  trials = generateTrials();
  trialIdx = 0; answers = [];
  document.getElementById('progress').style.width = '0%';
  document.getElementById('progress-label').textContent = '0/4';
  runTrial();
}

runTrial();
</script>
</body>
</html>
