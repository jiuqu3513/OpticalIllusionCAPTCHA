<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spoke Illusion CAPTCHA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.back{align-self:flex-start;padding:8px 16px;color:#94a3b8;text-decoration:none;font-size:13px;margin:16px}.back:hover{color:#e2e8f0}
.container{width:100%;max-width:540px;background:#1e293b;border-radius:16px;padding:28px;margin:0 20px 40px;border:1px solid #334155}
h2{font-size:20px;text-align:center;margin-bottom:4px}.subtitle{text-align:center;font-size:12px;color:#64748b;margin-bottom:20px}
.instruction{background:#0f172a;border-radius:8px;padding:14px;margin-bottom:20px;font-size:13px;color:#94a3b8;line-height:1.6;text-align:center}
.instruction strong{color:#f87171}canvas{display:block;margin:0 auto;border-radius:10px}
.progress-row{display:flex;align-items:center;gap:10px;margin-top:16px}
.progress-bar{flex:1;height:4px;background:#334155;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:#60a5fa;width:0%;transition:width .3s}
.progress-label{font-size:12px;color:#64748b;white-space:nowrap}
.options{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.opt-btn{padding:10px 16px;border:1px solid #475569;border-radius:8px;background:#0f172a;color:#e2e8f0;cursor:pointer;font-size:13px;transition:all .15s}
.opt-btn:hover{background:#1e3a5f;border-color:#60a5fa}.opt-btn:disabled{opacity:.4;cursor:not-allowed}
.result-box{margin-top:20px;padding:18px;border-radius:10px;text-align:center;display:none}
.result-box.pass{background:#052e16;border:1px solid #166534;color:#4ade80;display:block}
.result-box.fail{background:#450a0a;border:1px solid #991b1b;color:#f87171;display:block}
.result-box h3{margin-bottom:6px;font-size:18px}.result-box p{font-size:13px;opacity:.9}
.score-detail{font-size:11px;color:#94a3b8;margin-top:8px}
.restart-btn{margin-top:12px;padding:10px 28px;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px}.restart-btn:hover{background:#1d4ed8}
</style></head><body>
<a href="../../" class="back">← 首页</a>
<div class="container">
<h2>🛞 Spoke Illusion</h2><p class="subtitle">辐条错觉 — 亮度波旅行产生运动感 + 意外的运动后效</p>
<div class="instruction" id="tip">注视中心。<strong>辐条轮看起来在旋转吗？停止后静止的辐条还在转吗？</strong></div>
<canvas id="c" width="480" height="480"></canvas>
<div class="progress-row"><div class="progress-bar"><div class="progress-fill" id="pg"></div></div><div class="progress-label" id="pl">0/5</div></div>
<div class="options" id="op"></div>
<div class="result-box" id="re"><h3 id="rt"></h3><p id="rd"></p><div class="score-detail" id="sd"></div><button class="restart-btn" onclick="rst()">重新验证</button></div>
</div>
<script src="../../js/collector.js"></script><script src="../../js/captcha-fw.js"></script>
<script>
// 精确复刻 mot-spokes OTView.j
// 16扇区, 亮度波旅行(rpm=60=1rev/s), contrast=30, r=0.9*ym
// 扇形只填半个扇角, 有间隙, 灰色辐条lineWidth=3
// 后效: 适应旋转→静止后感知反向旋转

const c=document.getElementById('c'),x=c.getContext('2d'),W=480,H=480,CX=W/2,CY=H/2;
const N=16,CONTRAST=30,RPM=60,R=0.9*CY;
const ANGLE1=2*Math.PI/N,ANGLE2=ANGLE1/2;

function drawWheel(elapsedSec,rpmSign){
  x.fillStyle='#bfbfbf';x.fillRect(0,0,W,H);
  x.save();x.translate(CX,CY);
  // 亮度波相位 (复刻源码 round 离散步进)
  let step=Math.round(elapsedSec/60*RPM*N*rpmSign);
  for(let i=0;i<N;i++){
    let cf=Math.sin(2*Math.PI*((i+step)%N)/N);
    let grey=0.5+0.5*CONTRAST/100*cf;
    x.fillStyle=`rgb(${Math.round(grey*255)},${Math.round(grey*255)},${Math.round(grey*255)})`;
    // 完全不用 arc() — 避免 Safari Canvas 子路径兼容问题
    // moveTo中心 → lineTo弧上各点 → closePath回中心
    x.beginPath();x.moveTo(0,0);
    const STEPS=6; // 6段逼近22.5°弧，每段~3.75°
    for(let s=0;s<=STEPS;s++){
      let a=-ANGLE2+2*ANGLE2*s/STEPS;
      x.lineTo(R*Math.cos(a),R*Math.sin(a));
    }
    x.closePath();x.fill();
    x.rotate(ANGLE1);
  }
  x.rotate(ANGLE2);
  x.strokeStyle='#808080';x.lineWidth=3;x.lineCap='round';
  for(let i=0;i<N;i++){x.beginPath();x.moveTo(0,0);x.lineTo(R,0);x.stroke();x.rotate(ANGLE1)}
  x.fillStyle='#ef4444';x.beginPath();x.arc(0,0,6,0,2*Math.PI);x.fill();
  x.restore();
}

let trials,tIdx,answers,animId,tStart;
function gen(){let t=[];
// 3 正常: 亮度波旅行 8s → 静止测试 (后效反方向)
t.push({type:'normal',adaptDur:8,adaptDir:1,expSign:-1}); // 适应CW→后效CCW
t.push({type:'normal',adaptDur:8,adaptDir:1,expSign:-1});
t.push({type:'normal',adaptDur:8,adaptDir:-1,expSign:1}); // 适应CCW→后效CW
// 1 捕捉: 零适应
t.push({type:'catch',ct:'zero',adaptDur:0,adaptDir:0,expSign:0});
// 1 捕捉: 亮度波持续运行 (应看到明显旋转)
t.push({type:'catch',ct:'running',adaptDur:0,adaptDir:1,expSign:1,running:true});
return t.sort(()=>Math.random()-.5)}
CAPTCHA.reset();trials=gen();tIdx=0;answers=[];

function run(){if(tIdx>=trials.length){showR();return}
let tr=trials[tIdx];document.getElementById('op').innerHTML='';
document.getElementById('pl').textContent=`${tIdx+1}/${trials.length}`;
document.getElementById('pg').style.width=(tIdx/trials.length*100)+'%';

if(tr.adaptDur===0&&!tr.running){// 零适应
  drawWheel(0,0);
  document.getElementById('tip').innerHTML='静止辐条轮。<strong>它在旋转吗？</strong>';
  tStart=performance.now();setTimeout(()=>showQ(tr,false),2500);
}else if(tr.running){// 持续运行
  startAdapt(tr,()=>showQ(tr,true));
}else{// 适应→测试
  document.getElementById('tip').innerHTML='准备注视中心红点…';
  drawWheel(0,0);setTimeout(()=>startAdapt(tr,()=>{document.getElementById('tip').innerHTML='<strong>辐条停止了！</strong>静止辐条看起来在转吗？方向？';tStart=performance.now();setTimeout(()=>showQ(tr,false),2000)}),500)}
}

function startAdapt(tr,onDone){let elapsed=0,lt=performance.now();
function anim(now){let dt=Math.min((now-lt)/1000,.1);lt=now;elapsed+=dt;
  drawWheel(elapsed,tr.adaptDir);
  if(elapsed<tr.adaptDur&&tr.adaptDur>0){animId=requestAnimationFrame(anim);document.getElementById('tip').innerHTML='🔴 <strong>盯住中心红点！</strong>辐条在旋转…'}
  else if(tr.running&&elapsed<4){animId=requestAnimationFrame(anim);document.getElementById('tip').innerHTML='<strong>辐条在旋转。</strong>注意方向…'}
  else{onDone()}}
animId=requestAnimationFrame(anim)}

function showQ(tr,isRunning){
  document.getElementById('tip').innerHTML=tr.running?'<strong>辐条在往哪个方向转？</strong>':'<strong>静止辐条看起来在往哪个方向转？</strong>';
  tStart=performance.now();
  document.getElementById('op').innerHTML=['逆时针很强','逆时针中等','逆时针轻微','完全不动','顺时针轻微','顺时针中等','顺时针很强'].map((l,i)=>`<button class="opt-btn" onclick="ans(${i-3})">${l}</button>`).join('')}

function ans(s){answers.push({trial:trials[tIdx],score:s,rt:performance.now()-tStart});tIdx++;document.getElementById('pg').style.width=(tIdx/trials.length*100)+'%';run()}

function showR(){document.getElementById('op').innerHTML='';document.getElementById('tip').innerHTML='验证完成';document.getElementById('pg').style.width='100%';document.getElementById('pl').textContent=`${trials.length}/${trials.length}`;
let total=100;let norm=answers.filter(a=>a.trial.type==='normal');let zero=answers.find(a=>a.trial.ct==='zero');let running=answers.find(a=>a.trial.ct==='running');
// 正常: 适应CW→后效应CCW(负分), 适应CCW→后效应CW(正分)
norm.forEach(a=>{let expSign=a.trial.expSign;if(a.score*expSign>0){}else if(a.score===0)total-=7;else total-=15});
// 零适应: 应报告不动
if(zero&&Math.abs(zero.score)>=1)total-=30;
// 持续运行: 应看到旋转
if(running&&running.score===0)total-=25;if(running&&running.score*running.trial.expSign<=0)total-=20;
total=Math.max(0,Math.min(100,Math.round(total)));let box=document.getElementById('re');box.className='result-box '+(total>=60?'pass':'fail');
document.getElementById('rt').textContent=total>=60?'✓ 验证通过':'✗ 验证失败';document.getElementById('rd').textContent=`得分: ${total}/100 (阈值: 60)`;
document.getElementById('sd').textContent=`零适应: ${zero&&Math.abs(zero.score)<1?'✓':'✗'} | 运行: ${running&&running.score!==0?'✓':'✗'}`;box.style.display='block';CAPTCHA.init('spokes',total,total>=60,trials,function(i){tIdx=i;document.getElementById('pg').style.width=(i/trials.length*100)+'%';answers=answers.slice(0,i);run()})}
function rst(){document.getElementById('re').style.display='none';CAPTCHA.reset();trials=gen();tIdx=0;answers=[];document.getElementById('pg').style.width='0%';document.getElementById('pl').textContent='0/5';run()}
run();</script></body></html>
